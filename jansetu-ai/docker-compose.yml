version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jansetu_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DATABASE_URL=sqlite+aiosqlite:///./jansetu.db
      - SYNC_DATABASE_URL=sqlite:///./jansetu.db
      - ML_MODELS_DIR=../ml/models
      - CORS_ORIGINS=["http://localhost:5173", "http://localhost:3000"]
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/jansetu.db:/app/jansetu.db
      - ./ml/models:/ml/models

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jansetu_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
